[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cap-eval"
version = "0.1.0"
description = "CAP: an NLI-based metric for judging QA answer correctness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
# Core: enough to run `cap-eval evaluate` on existing score files.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Statement model, CAP and the BLEU/ROUGE-L/METEOR/BERTScore baselines.
models = [
    "torch>=2.1",
    "transformers>=4.46,<5",
    "accelerate>=0.26",
    "datasets>=2.18",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25",
    "scikit-learn>=1.3",
    "sacrebleu>=2.4",
    "rouge-score>=0.1.2",
    "nltk>=3.8.2",
    "bert-score>=0.3.13",
]
# COMET pins its own torch/lightning versions, so it is kept separate.
comet = ["unbabel-comet>=2.2"]
dev = ["pytest>=8"]

[project.scripts]
cap-eval = "cap_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
